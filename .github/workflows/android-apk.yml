name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PixelCapsuleAndroid/**'
      - '.github/workflows/android-apk.yml'

# Pixel Capsule 1.0.1: build the latest corrected source only. The first build step also cancels
# older queued runs created before this concurrency policy was added.
concurrency:
  group: pixel-capsule-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Cancel stale queued builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "${GITHUB_REPOSITORY}" --workflow android-apk.yml --status queued --limit 50 --json databaseId -q '.[].databaseId' |
          while read -r run_id; do
            [ -z "$run_id" ] && continue
            [ "$run_id" = "$GITHUB_RUN_ID" ] && continue
            echo "Cancelling stale queued run $run_id"
            gh run cancel "$run_id" --repo "${GITHUB_REPOSITORY}" || true
          done

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify Android source
        run: |
          test -f PixelCapsuleAndroid/settings.gradle.kts
          test -f PixelCapsuleAndroid/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 20.0
          packages: platform-tools
          accept-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests
        working-directory: PixelCapsuleAndroid
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: PixelCapsuleAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelCapsule-debug-apk
          path: PixelCapsuleAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
