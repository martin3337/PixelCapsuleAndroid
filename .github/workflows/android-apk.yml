name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - 'PixelCapsuleAndroid/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Extract uploaded Android project
        shell: bash
        run: |
          if [ -f PixelCapsuleAndroid/settings.gradle.kts ] && [ -f PixelCapsuleAndroid/app/build.gradle.kts ]; then
            echo "Tracked Android source already exists; keeping current project files."
          else
            archive="$(find . -maxdepth 1 -type f -iname 'PixelCapsuleAndroid-Source*.zip' -print -quit)"
            if [ -z "$archive" ]; then
              echo "No PixelCapsuleAndroid-Source ZIP found in repository root."
              ls -la
              exit 1
            fi
            echo "Extracting: $archive"
            unzip -oq "$archive" -d .
          fi
          test -f PixelCapsuleAndroid/settings.gradle.kts
          test -f PixelCapsuleAndroid/app/build.gradle.kts
      - name: Commit extracted Android source to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PixelCapsuleAndroid/
          if ! git diff --cached --quiet; then
            git commit -m "Add extracted PixelCapsuleAndroid source"
            git push
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 20.0
          packages: platform-tools
          accept-android-sdk-licenses: false
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Build debug APK
        working-directory: PixelCapsuleAndroid
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelCapsule-debug-apk
          path: PixelCapsuleAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
