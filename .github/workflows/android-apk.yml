name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PixelCapsuleAndroid-Source.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Extract Android project archive
        run: |
          test -f PixelCapsuleAndroid-Source.zip
          unzip -q PixelCapsuleAndroid-Source.zip -d .
          test -f PixelCapsuleAndroid/settings.gradle.kts
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Build debug APK
        working-directory: PixelCapsuleAndroid
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelCapsule-debug-apk
          path: PixelCapsuleAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
